<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shop – LUXE Jewelry</title>
  <link rel="stylesheet" href="../assets/css/style.css" />
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
  <!-- Navbar -->
  <header id="site-header" class="flex justify-between items-center px-8 py-4">
    <h1 onclick="window.location.href='index.html'" class="text-2xl font-serif logo-btn">LUXE Jewelry</h1>

    <nav class="flex items-center gap-6">
      <a href="index.html" class="font-medium">Home</a>
      <a href="shop.html" class="font-medium">Shop</a>
      <a href="about.html" class="font-medium">About Us</a>
      <a href="contact.html" class="font-medium">Contact</a>

      <!-- Cart icon -->
      <a href="cart.html" class="text-xl" aria-label="Cart">🛒</a>

      <!-- Profile dropdown -->
      <div class="relative" id="profile-dropdown">
        <button id="profileBtn"
                aria-haspopup="true"
                aria-expanded="false"
                class="flex items-center gap-2 px-3 py-1 rounded-full border"
                title="Account">
          <span class="w-8 h-8 rounded-full bg-[#efe6d6] flex items-center justify-center font-semibold text-sm" aria-hidden="true">LJ</span>
        </button>

        <div id="profileMenu"
             class="hidden absolute right-0 mt-2 w-48 rounded shadow-lg origin-top-right ring-1 ring-black/5 bg-white"
             role="menu"
             aria-orientation="vertical"
             aria-labelledby="profileBtn">
          <a href="#" class="block px-4 py-3 text-sm hover:bg-gray-50" role="menuitem">Profile</a>
          <a href="#" class="block px-4 py-3 text-sm hover:bg-gray-50" role="menuitem">Account settings</a>
          <div class="border-t my-1"></div>
          <button id="darkToggle"
                  class="w-full text-left px-4 py-3 text-sm hover:bg-gray-50 flex items-center justify-between"
                  role="menuitem">
            <span>Dark mode</span>
            <span id="darkIcon" class="text-sm text-gray-600">🌙</span>
          </button>
        </div>
      </div>
    </nav>
  </header>

  <!-- Shop / Catalog -->
  <section class="section">
    <div class="container">
      <h2 class="title">Catalog</h2>

      <div class="cards">
        <!-- Product 1 -->
        <article class="product-card">
          <img src="../assets/img/product1.jpg" alt="Silver Ring">
          <div class="title">Silver Ring</div>
          <div class="price">$49.990</div>
          <a href="product.html" class="btn">View</a>
        </article>

        <!-- Product 2 -->
        <article class="product-card">
          <img src="../assets/img/product2.jpg" alt="Gold Necklace">
          <div class="title">Gold Necklace</div>
          <div class="price">$89.990</div>
          <a href="product.html" class="btn">View</a>
        </article>

        <!-- Product 3 -->
        <article class="product-card">
          <img src="../assets/img/product3.jpg" alt="Diamond Earrings">
          <div class="title">Diamond Earrings</div>
          <div class="price">$129.990</div>
          <a href="product.html" class="btn">View</a>
        </article>

        <!-- Product 4 -->
        <article class="product-card">
          <img src="../assets/img/product4.jpg" alt="Pearl Bracelet">
          <div class="title">Pearl Bracelet</div>
          <div class="price">$69.990</div>
          <a href="product.html" class="btn">View</a>
        </article>

        <!-- Add more products by duplicating the .product-card block -->
      </div>

      <!-- Optional simple pagination (visual only) -->
      <div class="row center" style="margin-top: 2rem;">
        <nav aria-label="Pagination">
          <ul style="display:flex; gap:.5rem; list-style:none; padding:0; margin:0;">
            <li><a class="btn" href="#">Prev</a></li>
            <li><a class="btn" href="#">1</a></li>
            <li><a class="btn" href="#">2</a></li>
            <li><a class="btn" href="#">Next</a></li>
          </ul>
        </nav>
      </div>
    </div>
  </section>

  <!-- Footer -->
  <footer class="text-center py-6 mt-12">
    <p class="text-sm">&copy; 2025 LUXE Jewelry</p>
  </footer>

  <script src="../assets/js/main.js"></script>
</body>
</html>
